[workspace]
resolver = "3"
members = [
    "crates/kural-core",
    "crates/kural-db",
    "crates/kural-enricher",
    "crates/kural-audio",
    "crates/kural-voice-cmd",
    "crates/kural-ai",
    "crates/kural-backend",
    "crates/kural-app",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1"
audioadapter-buffers = "4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
dioxus = { version = "0.7", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
model2vec-rs = { version = "0.5", default-features = false, features = ["onig", "local-only"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ringbuf = "0.6"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rubato = "4"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "2.0"
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tikv-jemallocator = "0.6"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
toml = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
