name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-deb:
    name: Build & Publish Debian Package (amd64)
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: /tmp/kural-build
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux & packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libonig-dev cmake pkg-config espeak-ng dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Debian package
        run: chmod +x packaging/linux/build_deb.sh && ./packaging/linux/build_deb.sh --arch amd64 --build

      - name: Generate SHA256SUMS
        run: (cd dist/packages && sha256sum *.deb > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
