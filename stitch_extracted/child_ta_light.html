        <svg viewBox="0 0 24 24" class="w-4 h-4 relative shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        <span data-ta="&#34;தாத்தா, அடுத்த குறள்&#34; என்று சொல்லுங்கள்" data-en="Say &#34;Next Kural&#34;, &#34;Story&#34;, or &#34;Dark Mode&#34;">&#34;தாத்தா, அடுத்த குறள்&#34; என்று சொல்லுங்கள்</span>
      </button>

      <button id="sound-toggle" type="button" onclick="toggleSound()" class="toy-btn px-4 py-1.5 rounded-full bg-light-surface dark:bg-dark-surface-2 border border-light-outline dark:border-dark-outline text-xs font-extrabold flex items-center gap-1.5">
        <span id="sound-icon">🔊</span>
        <span id="sound-label" data-ta="ஒலி: ஆன்" data-en="Sound: On">ஒலி: ஆன்</span>
      </button>
    </footer>

    <!-- PI 480x320 ZONE 3: 3-Slot Bottom Action Dock (Story + Center Voice Orb + Audio) -->
    <footer id="pi-zone-3" class="pi-only pi-grid-only shrink-0">
      <button type="button" onclick="triggerAction(&#39;story&#39;)" class="pi-dock-tile clay-card-interactive bg-[#C8F7E0] dark:bg-[#10382B] border-2 border-[#2ECC8F] border-b-[#1B8F5A] flex flex-col items-center justify-center">
        <svg viewBox="0 0 24 24" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        <span class="pi-dock-label font-extrabold text-[#0B3B24] dark:text-white mt-1" data-ta="கதை" data-en="Story">கதை</span>
      </button>

      <!-- Center Elevated 3D Voice Orb -->
      <div class="relative flex items-end justify-center">
        <span class="anim-orb-pulse absolute w-[74px] h-[74px] rounded-full border-[3px] border-gold-frame pointer-events-none"></span>
        <button id="pi-voice-orb" type="button" onclick="toggleVoiceHud()" class="toy-btn relative rounded-full bg-gradient-to-b from-gradient-start via-gradient-mid to-gradient-end border-2 border-white/70 text-white flex flex-col items-center justify-center shadow-lg">
          <svg viewBox="0 0 24 24" class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
          <span class="text-[10px] font-extrabold mt-0.5" data-ta="பேசு" data-en="Speak">பேசு</span>
        </button>
      </div>

      <button type="button" onclick="triggerAction(&#39;audio&#39;)" class="pi-dock-tile clay-card-interactive bg-[#FFE5BD] dark:bg-[#38230D] border-2 border-[#FFB300] border-b-[#D87B00] flex flex-col items-center justify-center">
        <span class="text-base leading-none">🎧</span>
        <span class="pi-dock-label font-extrabold text-[#4A2500] dark:text-white mt-1" data-ta="கேள்" data-en="Audio">கேள்</span>
      </button>
    </footer>
  </div>

  <!-- Interactive Voice Listening HUD / Toast -->
  <div id="voice-hud" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-light-surface dark:bg-dark-surface border-2 border-gold-frame rounded-full px-5 py-2.5 shadow-2xl flex items-center gap-3">
    <div class="flex items-end gap-1 h-5" aria-hidden="true">
      <span class="eq-bar w-1.5 h-5 rounded-full bg-gradient-start"></span>
      <span class="eq-bar w-1.5 h-5 rounded-full bg-gradient-mid"></span>
      <span class="eq-bar w-1.5 h-5 rounded-full bg-gradient-end"></span>
      <span class="eq-bar w-1.5 h-5 rounded-full bg-gradient-mid"></span>
      <span class="eq-bar w-1.5 h-5 rounded-full bg-gradient-start"></span>
    </div>
    <span id="voice-hud-text" class="font-extrabold text-sm text-light-on-bg dark:text-dark-on-bg whitespace-nowrap" data-ta="கேட்கிறேன்... பேசுங்கள்!" data-en="Listening... Speak now!">கேட்கிறேன்... பேசுங்கள்!</span>
    <button type="button" onclick="toggleVoiceHud(false)" class="ml-1 text-xs font-extrabold px-2 py-0.5 rounded-full bg-light-surface-2 dark:bg-dark-surface-2">✕</button>
  </div>

  <script>
    const KURALS = [
      {
        num: 1,
        couplet: 'அகர முதல எழுத்தெல்லாம் ஆதி<br/>பகவன் முதற்றே உலகு.',
        ta: 'எழுத்துக்கள் எல்லாம் \'அ\' என்ற எழுத்தில் தொடங்குவது போல, இந்த உலகம் இறைவனை முதலாகக் கொண்டது.',
        en: 'Just as the letter "A" begins all words, kindness and the Creator begin our whole world.'
      },
      {
        num: 391,
        couplet: 'கற்க கசடறக் கற்பவை கற்றபின்<br/>நிற்க அதற்குத் தக.',
        ta: 'நல்ல பாடங்களைக் குற்றமின்றித் தெளிவாகக் கற்று, கற்றபடியே நல்ல ஒழுக்கத்துடன் வாழ வேண்டும்.',
        en: 'Learn good things clearly without mistakes, and then live by what you have learned!'
      },
      {
        num: 100,
        couplet: 'இனிய உளவாக இன்னாத கூறல்<br/>கனியிருப்பக் காய்கவர்ந் தற்று.',
        ta: 'இனிமையான சொற்கள் இருக்கும்போது கடுமையான சொற்களைப் பேசுவது, பழம் இருக்கும்போது காயைத் தின்பது போன்றது.',
        en: 'Using harsh words when sweet words exist is like eating a sour unripe fruit instead of a ripe mango!'
      }
    ];

    let kuralIdx = 0;
    let currentLang = document.documentElement.getAttribute('lang') || 'ta';
    let soundOn = true;
    let listening = false;
    let listenTimer = null;

    function isPiCompact() {
      return window.innerWidth <= 560 && window.innerHeight <= 380;
    }

    function renderKural() {
      const k = KURALS[kuralIdx];
      const coupletEl = document.getElementById('kural-couplet');
      const meaningEl = document.getElementById('kural-meaning');
      const badgeEl = document.getElementById('kural-badge-text');

      coupletEl.innerHTML = k.couplet;
      meaningEl.textContent = currentLang === 'ta' ? k.ta : k.en;

      if (isPiCompact()) {
        badgeEl.textContent = (currentLang === 'ta' ? 'குறள் #' : 'Kural #') + k.num;
      } else {
        const prefix = currentLang === 'ta' ? badgeEl.dataset.taPrefix : badgeEl.dataset.enPrefix;
        badgeEl.textContent = prefix + k.num;
      }
    }

    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.setAttribute('lang', lang);

      const taPill = document.getElementById('lang-ta-pill');
      const enPill = document.getElementById('lang-en-pill');
      if (lang === 'ta') {
        taPill.className = 'px-2 py-0.5 rounded-full bg-gradient-start text-[#1A1100]';
        enPill.className = 'px-2 py-0.5 rounded-full text-light-text-muted dark:text-dark-text-muted';
      } else {
        enPill.className = 'px-2 py-0.5 rounded-full bg-gradient-start text-[#1A1100]';
        taPill.className = 'px-2 py-0.5 rounded-full text-light-text-muted dark:text-dark-text-muted';
      }

      document.querySelectorAll('[data-ta][data-en]').forEach((el) => {
        if (isPiCompact() && el.dataset.piTa && el.dataset.piEn) {
          el.textContent = lang === 'ta' ? el.dataset.piTa : el.dataset.piEn;
        } else {
          el.textContent = lang === 'ta' ? el.dataset.ta : el.dataset.en;
        }
      });

      renderKural();
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      html.setAttribute('data-theme', isDark ? 'dark' : 'light');
    });

    document.getElementById('lang-toggle').addEventListener('click', () => {
      applyLanguage(currentLang === 'ta' ? 'en' : 'ta');
    });

    document.getElementById('prev-kural').addEventListener('click', () => {
      kuralIdx = (kuralIdx - 1 + KURALS.length) % KURALS.length;
      renderKural();
    });

    document.getElementById('next-kural').addEventListener('click', () => {
      kuralIdx = (kuralIdx + 1) % KURALS.length;
      renderKural();
    });

    function toggleVoiceHud(forceState) {
      const hud = document.getElementById('voice-hud');
      listening = typeof forceState === 'boolean' ? forceState : !listening;
      hud.classList.toggle('hidden', !listening);
    }

    function triggerListen() {
      const couplet = document.getElementById('kural-couplet');
      couplet.classList.add('text-light-primary', 'dark:text-dark-primary', 'scale-[1.02]');
      const hud = document.getElementById('voice-hud');
      const hudText = document.getElementById('voice-hud-text');
      hudText.textContent = currentLang === 'ta' ? '🔊 குறள் ஒலிக்கிறது...' : '🔊 Playing Kural audio...';
      hud.classList.remove('hidden');
      clearTimeout(listenTimer);
      listenTimer = setTimeout(() => {
        couplet.classList.remove('text-light-primary', 'dark:text-dark-primary', 'scale-[1.02]');
        hud.classList.add('hidden');
        hudText.textContent = currentLang === 'ta' ? hudText.dataset.ta : hudText.dataset.en;
      }, 2200);
    }

    function triggerAction(kind) {
      const labels = {
        story: { ta: '📖 குறள் கதைகள் திறக்கிறது...', en: '📖 Opening Kural Stories...' },
        games: { ta: '🎮 குறள் விளையாட்டு திறக்கிறது...', en: '🎮 Opening Fun Games...' },
        audio: { ta: '🎧 குறள் பாடல்கள் திறக்கிறது...', en: '🎧 Opening Audio Rhymes...' },
        search: { ta: '🔍 குறள் தேடல் திறக்கிறது...', en: '🔍 Opening Kural Search...' }
      };
      const hud = document.getElementById('voice-hud');
      const hudText = document.getElementById('voice-hud-text');
      hudText.textContent = labels[kind][currentLang];
      hud.classList.remove('hidden');
      clearTimeout(listenTimer);
      listenTimer = setTimeout(() => {
        hud.classList.add('hidden');
        hudText.textContent = currentLang === 'ta' ? hudText.dataset.ta : hudText.dataset.en;
      }, 1800);
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('sound-icon').textContent = soundOn ? '🔊' : '🔇';
      const label = document.getElementById('sound-label');
      label.dataset.ta = soundOn ? 'ஒலி: ஆன்' : 'ஒலி: ஆஃப்';
      label.dataset.en = soundOn ? 'Sound: On' : 'Sound: Off';
      label.textContent = currentLang === 'ta' ? label.dataset.ta : label.dataset.en;
    }

    window.addEventListener('resize', () => applyLanguage(currentLang));
    applyLanguage(currentLang);
  </script>


</body></html>
